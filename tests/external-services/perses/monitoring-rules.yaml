groups:
- name: enmaas-benchmark
  interval: 15s
  rules:
  - alert: EnmaasGeneratorConcurrencyLimited
    expr: (enmaas_stress_skipped_concurrency / enmaas_stress_offered_slots > 0.01)
      and on() (time() - enmaas_stress_sample_unixtime_seconds < 30)
    for: 15s
    labels:
      severity: warning
      category: generator
      summary: Generator concurrency cap skips offered requests
      action: Do not claim gateway capacity; compare active requests with generator
        cap
      detail: benchmark
      component: benchmark
    annotations:
      summary: Generator concurrency cap skips offered requests
      description: Do not claim gateway capacity; compare active requests with generator
        cap
      dashboard: /projects/praxis/dashboards/enmaas-benchmark
  - alert: EnmaasGeneratorSchedulerLimited
    expr: (enmaas_stress_skipped_scheduler / enmaas_stress_offered_slots > 0.01) and
      on() (time() - enmaas_stress_sample_unixtime_seconds < 30)
    for: 15s
    labels:
      severity: warning
      category: generator
      summary: Generator scheduling misses offered requests
      action: Inspect generator CPU and event-loop delay before increasing offered
        traffic
      detail: benchmark
      component: benchmark
    annotations:
      summary: Generator scheduling misses offered requests
      description: Inspect generator CPU and event-loop delay before increasing offered
        traffic
      dashboard: /projects/praxis/dashboards/enmaas-benchmark
  - alert: EnmaasHostCpuHigh
    expr: 100 * sum by(host)(rate(enmaas_host_cpu_seconds_total{state!~"idle|iowait"}[2m]))
      / clamp_min(sum by(host)(rate(enmaas_host_cpu_seconds_total[2m])), 1e-9) > 85
    for: 2m
    labels:
      severity: warning
      category: capacity
      summary: Host CPU over 85%
      action: Reduce offered load; inspect host CPU
      detail: host
      component: linux-host
    annotations:
      summary: Host CPU over 85%
      description: Reduce offered load; inspect host CPU
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasHostMemoryLow
    expr: 100 * sum by(host)(enmaas_host_memory_bytes{state="available"}) / sum by(host)(enmaas_host_memory_bytes{state="total"})
      < 15
    for: 2m
    labels:
      severity: warning
      category: capacity
      summary: Host available memory below 15%
      action: Reduce concurrency; inspect memory and cache
      detail: host
      component: linux-host
    annotations:
      summary: Host available memory below 15%
      description: Reduce concurrency; inspect memory and cache
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasHostMemoryCritical
    expr: 100 * sum by(host)(enmaas_host_memory_bytes{state="available"}) / sum by(host)(enmaas_host_memory_bytes{state="total"})
      < 8
    for: 30s
    labels:
      severity: critical
      category: capacity
      summary: Host available memory below 8%
      action: Stop load before OOM
      detail: host
      component: linux-host
    annotations:
      summary: Host available memory below 8%
      description: Stop load before OOM
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasHostDiskLow
    expr: 100 * sum by(host)(enmaas_host_disk_bytes{state="available"}) / sum by(host)(enmaas_host_disk_bytes{state="total"})
      < 15
    for: 2m
    labels:
      severity: warning
      category: storage
      summary: Data filesystem below 15% available
      action: Inspect retention and stored data
      detail: host
      component: linux-host
    annotations:
      summary: Data filesystem below 15% available
      description: Inspect retention and stored data
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasHostDiskCritical
    expr: 100 * sum by(host)(enmaas_host_disk_bytes{state="available"}) / sum by(host)(enmaas_host_disk_bytes{state="total"})
      < 8
    for: 30s
    labels:
      severity: critical
      category: storage
      summary: Data filesystem below 8% available
      action: Stop load; reclaim owned retained data
      detail: host
      component: linux-host
    annotations:
      summary: Data filesystem below 8% available
      description: Stop load; reclaim owned retained data
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasContainerMemoryHigh
    expr: 100 * enmaas_container_memory_bytes / (enmaas_container_memory_limit_bytes
      > 0) > 80
    for: 1m
    labels:
      severity: warning
      category: capacity
      summary: Component memory above 80% of its limit
      action: Inspect component headroom before increasing load
      detail: components
    annotations:
      summary: Component memory above 80% of its limit
      description: Inspect component headroom before increasing load
      dashboard: /projects/praxis/dashboards/enmaas-components
  - alert: EnmaasFileDescriptorsHigh
    expr: 100 * praxis_process_open_fds / praxis_process_max_fds > 80
    for: 2m
    labels:
      severity: warning
      category: capacity
      summary: Gateway file descriptors above 80%
      action: Inspect concurrency and upstream connections
      detail: gateway
      component: praxis
    annotations:
      summary: Gateway file descriptors above 80%
      description: Inspect concurrency and upstream connections
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasDatabasePoolWaiting
    expr: sum(rate(metering_db_pool_wait_seconds_total[2m])) > 0.1
    for: 2m
    labels:
      severity: warning
      category: usage_metering
      summary: Metering database pool is waiting
      action: Inspect pool use and database latency
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: Metering database pool is waiting
      description: Inspect pool use and database latency
      dashboard: /projects/praxis/dashboards/enmaas-accounting
  - alert: EnmaasAccountingInsertErrors
    expr: sum(increase(metering_usage_event_insert_errors_total[2m])) > 0
    for: 15s
    labels:
      severity: critical
      category: usage_metering
      summary: Usage insertion errors observed
      action: Stop capacity claims; investigate usage-record delivery
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: Usage insertion errors observed
      description: Stop capacity claims; investigate usage-record delivery
      dashboard: /projects/praxis/dashboards/enmaas-accounting
  - alert: EnmaasInferenceSlow
    expr: sum(rate(praxis_http_request_duration_seconds_sum{cluster=~"authenticated-openai|authenticated-anthropic"}[2m]))
      / sum(rate(praxis_http_request_duration_seconds_count{cluster=~"authenticated-openai|authenticated-anthropic"}[2m]))
      > 5
    for: 2m
    labels:
      severity: warning
      category: traffic
      summary: Mean inference duration above five seconds
      action: Compare upstream delay with CPU and pool waits
      detail: gateway
      component: praxis
    annotations:
      summary: Mean inference duration above five seconds
      description: Compare upstream delay with CPU and pool waits
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasGatewayServerErrors
    expr: sum(rate(praxis_http_requests_total{cluster=~"authenticated-openai|authenticated-anthropic|dashboard|none",status_class="5xx"}[2m]))
      / clamp_min(sum(rate(praxis_http_requests_total{cluster=~"authenticated-openai|authenticated-anthropic|dashboard|none"}[2m])),
      1e-9) > 0.05
    for: 1m
    labels:
      severity: critical
      category: traffic
      summary: More than 5% gateway responses are 5xx
      action: Inspect traces and upstream failures
      detail: gateway
      component: praxis
    annotations:
      summary: More than 5% gateway responses are 5xx
      description: Inspect traces and upstream failures
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasRateLimitActive
    expr: sum(rate(praxis_rate_limit_limited_total[2m])) > 0
    for: 15s
    labels:
      severity: warning
      category: policy
      summary: Rate limiting is rejecting traffic
      action: Expected in denial phase; not proof of capacity exhaustion
      detail: gateway
      component: praxis
    annotations:
      summary: Rate limiting is rejecting traffic
      description: Expected in denial phase; not proof of capacity exhaustion
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasQuotaDenials
    expr: sum(rate(metering_quota_denials_total[2m])) > 0
    for: 15s
    labels:
      severity: warning
      category: policy
      summary: Spending policy denied requests
      action: Inspect PriceTag budgets; not a host bottleneck
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: Spending policy denied requests
      description: Inspect PriceTag budgets; not a host bottleneck
      dashboard: /projects/praxis/dashboards/enmaas-accounting
  - alert: EnmaasGatewayScrapeFailed
    expr: up{exported_job="praxis"} == 0
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: Gateway scrape failed
      action: Inspect the gateway metrics listener and relay
      detail: gateway
      component: praxis
    annotations:
      summary: Gateway scrape failed
      description: Inspect the gateway metrics listener and relay
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasAccountingScrapeFailed
    expr: up{exported_job="pricetag-metering"} == 0
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: PriceTag scrape failed
      action: Inspect the metering metrics listener and relay
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: PriceTag scrape failed
      description: Inspect the metering metrics listener and relay
      dashboard: /projects/praxis/dashboards/enmaas-accounting
  - alert: EnmaasHostTelemetryStale
    expr: (time() - max_over_time(enmaas_host_sample_unixtime_seconds{host!=""}[24h])
      > 90) or absent(enmaas_host_sample_unixtime_seconds)
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: Host samples absent or stale
      action: Start sampler; missing telemetry is not healthy capacity
      detail: host
      component: linux-host
    annotations:
      summary: Host samples absent or stale
      description: Start sampler; missing telemetry is not healthy capacity
      dashboard: /projects/praxis/dashboards/enmaas-host
  - alert: EnmaasGatewayMetricsStale
    expr: (time() - max(timestamp(praxis_process_open_fds)) > 30) or absent(praxis_process_open_fds)
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: Gateway metric samples are stale
      action: Inspect the relay and receiving collector
      detail: gateway
      component: praxis
    annotations:
      summary: Gateway metric samples are stale
      description: Inspect the relay and receiving collector
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasAccountingMetricsStale
    expr: (time() - max(timestamp(metering_db_pool_open_conns)) > 30) or absent(metering_db_pool_open_conns)
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: PriceTag metric samples are stale
      action: Inspect the relay and receiving collector
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: PriceTag metric samples are stale
      description: Inspect the relay and receiving collector
      dashboard: /projects/praxis/dashboards/enmaas-accounting
  - alert: EnmaasGatewayScrapeMissing
    expr: absent(praxis_process_open_fds)
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: Gateway metrics absent
      action: Inspect gateway relay and scrape target
      detail: gateway
      component: praxis
    annotations:
      summary: Gateway metrics absent
      description: Inspect gateway relay and scrape target
      dashboard: /projects/praxis/dashboards/enmaas-gateway
  - alert: EnmaasAccountingScrapeMissing
    expr: absent(metering_db_pool_open_conns)
    for: 1m
    labels:
      severity: critical
      category: telemetry
      summary: PriceTag metrics absent
      action: Inspect metering relay and scrape target
      detail: accounting
      component: pricetag-metering
    annotations:
      summary: PriceTag metrics absent
      description: Inspect metering relay and scrape target
      dashboard: /projects/praxis/dashboards/enmaas-accounting
