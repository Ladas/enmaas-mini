name: External observability contracts and transport

on:
  pull_request:
    paths:
      - '.github/workflows/external-observability.yml'
      - 'tests/external-services/**'
      - 'scripts/pricetag/prepare.py'
      - 'scripts/common/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-observability.yml'
      - 'tests/external-services/**'
      - 'scripts/pricetag/prepare.py'
      - 'scripts/common/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman openssl shellcheck python3-yaml
      - name: Check inputs and installers
        run: |
          python3 -m unittest discover -s tests/external-services/unit -v
          bash -n tests/external-services/install-observability
          bash -n tests/external-services/install-telemetry-agent
          shellcheck -x tests/external-services/install-observability tests/external-services/install-telemetry-agent
      - name: Pull pinned images for the runner architecture
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/pricetag')
          import prepare
          images = json.loads(Path('tests/external-services/images.json').read_text())
          required = [prepare.PYTHON] + [images[name]['image'] for name in
              ('keycloak', 'auth', 'collector', 'prometheus', 'loki', 'tempo', 'perses')]
          for image in required:
              subprocess.run(['sudo', 'podman', 'pull', image], check=True, timeout=300)
          PY
      - name: Check private SSO, mTLS, redaction and storage
        run: |
          sudo python3 tests/external-services/private-issuer-runtime.py --keycloak
          sudo python3 tests/external-services/redaction.py
          sudo python3 tests/external-services/telemetry-runtime.py
