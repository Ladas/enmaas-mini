name: Build bootc images

on:
  pull_request:
    paths:
      - .github/workflows/bootc-images.yml
      - bootc/**
      - configs/**
      - scripts/common/**
  push:
    branches: [main]
    paths:
      - .github/workflows/bootc-images.yml
      - bootc/**
      - configs/**
      - scripts/common/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootc-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select image targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      praxis: ${{ steps.select.outputs.praxis }}
      vllm_cpu: ${{ steps.select.outputs.vllm_cpu }}
      vllm_gpu: ${{ steps.select.outputs.vllm_gpu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Explain optional build configuration
        env:
          BUILDS_ENABLED: ${{ vars.BOOTC_IMAGE_BUILDS_ENABLED }}
        run: |
          if [[ "$BUILDS_ENABLED" != true ]]; then
            echo "Bootc image builds are disabled. Configure the protected environments and set BOOTC_IMAGE_BUILDS_ENABLED=true; see bootc/README.md." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Select changed image groups
        id: select
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            printf '%s\n' '{"praxis":true,"vllm_cpu":true,"vllm_gpu":true}' >selected.json
          elif [[ "${{ github.event_name }}" == pull_request ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" >changed.txt
            python3 bootc/ci/select-images.py <changed.txt >selected.json
          else
            if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" >changed.txt
            else
              git diff --name-only HEAD^ HEAD >changed.txt
            fi
            python3 bootc/ci/select-images.py <changed.txt >selected.json
          fi
          for key in praxis vllm_cpu vllm_gpu; do
            value="$(jq -r ".$key" selected.json)"
            [[ "$value" == true || "$value" == false ]] || exit 1
            echo "${key}=${value}" >>"$GITHUB_OUTPUT"
          done

  build:
    name: Build selected bootc images
    needs: changes
    if: >-
      ${{
        github.repository == 'redhat-et/enmaas-mini' &&
        vars.BOOTC_IMAGE_BUILDS_ENABLED == 'true' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.fork == false) &&
        (github.event_name != 'workflow_dispatch' ||
         github.ref == 'refs/heads/main') &&
        (needs.changes.outputs.praxis == 'true' ||
         needs.changes.outputs.vllm_cpu == 'true' ||
         needs.changes.outputs.vllm_gpu == 'true')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.event_name == 'pull_request' && 'bootc-image-pr' || 'bootc-image-main' }}
    env:
      IMAGE_PREFIX: localhost/enmaas-mini
      IMAGE_RELEASE_TAG: v0.1
      RHEL_BOOTC_IMAGE: ${{ vars.RHEL_BOOTC_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install container tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq
      - name: Validate build configuration
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in RHEL_BOOTC_IMAGE REDHAT_REGISTRY_USERNAME REDHAT_REGISTRY_PASSWORD RHSM_ORG_ID RHSM_ACTIVATION_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing bootc build setting: ${name}. See bootc/README.md."
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]
      - name: Authenticate to Red Hat Registry
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$REDHAT_REGISTRY_PASSWORD" |
            sudo podman login registry.redhat.io \
              --username "$REDHAT_REGISTRY_USERNAME" --password-stdin
      - name: Build Praxis image
        if: needs.changes.outputs.praxis == 'true'
        env:
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
        run: sudo --preserve-env=RHEL_BOOTC_IMAGE,RHSM_ORG_ID,RHSM_ACTIVATION_KEY bootc/build praxis "$IMAGE_PREFIX"
      - name: Build vLLM CPU image
        if: needs.changes.outputs.vllm_cpu == 'true'
        env:
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
        run: sudo --preserve-env=RHEL_BOOTC_IMAGE,RHSM_ORG_ID,RHSM_ACTIVATION_KEY bootc/build vllm-cpu "$IMAGE_PREFIX"
      - name: Build vLLM GPU image
        if: needs.changes.outputs.vllm_gpu == 'true'
        env:
          RHSM_ORG_ID: ${{ secrets.RHSM_ORG_ID }}
          RHSM_ACTIVATION_KEY: ${{ secrets.RHSM_ACTIVATION_KEY }}
        run: sudo --preserve-env=RHEL_BOOTC_IMAGE,RHSM_ORG_ID,RHSM_ACTIVATION_KEY bootc/build vllm-gpu "$IMAGE_PREFIX"
      - name: Test selected images
        env:
          PRAXIS_SELECTED: ${{ needs.changes.outputs.praxis }}
          VLLM_CPU_SELECTED: ${{ needs.changes.outputs.vllm_cpu }}
          VLLM_GPU_SELECTED: ${{ needs.changes.outputs.vllm_gpu }}
        run: |
          set -euo pipefail
          variants=()
          [[ "$PRAXIS_SELECTED" == true ]] && variants+=(praxis)
          [[ "$VLLM_CPU_SELECTED" == true ]] && variants+=(vllm-cpu)
          [[ "$VLLM_GPU_SELECTED" == true ]] && variants+=(vllm-gpu)
          sudo bootc/test-images "$IMAGE_PREFIX" "${variants[@]}"
      - name: Publish images to Quay
        if: >-
          ${{
            github.ref == 'refs/heads/main' &&
            github.event_name != 'pull_request'
          }}
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          PRAXIS_SELECTED: ${{ needs.changes.outputs.praxis }}
          VLLM_CPU_SELECTED: ${{ needs.changes.outputs.vllm_cpu }}
          VLLM_GPU_SELECTED: ${{ needs.changes.outputs.vllm_gpu }}
        run: |
          set -euo pipefail
          test -n "$QUAY_USERNAME"
          test -n "$QUAY_TOKEN"
          printf '%s' "$QUAY_TOKEN" |
            sudo podman login quay.io --username "$QUAY_USERNAME" --password-stdin
          short_sha="${GITHUB_SHA::12}"
          variants=()
          [[ "$PRAXIS_SELECTED" == true ]] && variants+=(praxis)
          [[ "$VLLM_CPU_SELECTED" == true ]] && variants+=(vllm-cpu)
          [[ "$VLLM_GPU_SELECTED" == true ]] && variants+=(vllm-gpu)
          for variant in "${variants[@]}"; do
            repository="quay.io/redhat-et/enmaas-mini-${variant}"
            sudo podman tag "${IMAGE_PREFIX}:${variant}" "${repository}:${IMAGE_RELEASE_TAG}"
            sudo podman tag "${IMAGE_PREFIX}:${variant}" "${repository}:sha-${short_sha}"
            sudo podman push "${repository}:${IMAGE_RELEASE_TAG}"
            sudo podman push "${repository}:sha-${short_sha}"
          done
